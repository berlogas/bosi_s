name: backend

# Отдельный пайплайн для бэкенда. До этого CI покрывал только webapp/, и
# 632 теста FastAPI/PaperQA не запускались ни при одном пуше.

on:
  push:
    # Фильтра по веткам нет намеренно: с ограничением по именам веток CI
    # молчал на ветке разработки (react-migration) и прогонялся раз в
    # полгода на master.
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']

defaults:
  run:
    working-directory: backend

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      # PaperQA тянет из интернета при первом импорте, поэтому конфиг
      # закрепляем ровно как в репозитории, иначе расходятся настройки.
      - name: Тесты (pytest)
        run: |
          python -m pytest -q --tb=short 2>&1 | tee /tmp/pytest.log
          # причина падения должна читаться на странице прогона, а не в
          # длинном логе: выжимка уходит в сводку job'а
          {
            echo '## pytest'
            echo '```'
            grep -E '^(FAILED|ERROR)' /tmp/pytest.log | head -20 || echo 'падений нет'
            tail -5 /tmp/pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Линт (ruff)
        run: python -m ruff check app tests

      # Ловит ситуацию «поправили модель или эндпоинт, а openapi не
      # перегенерировали»: типы фронта собираются из того же файла, и расхождение
      # всплыло бы только на сборке фронта.
      # Шаг блокирующий: контракт — основа типов фронта, молчаливое расхождение
      # обойдется дороже красного прогона.
      #
      # Отдельным шагом, а не только тестом, потому что нужен отчет, который
      # читается без доступа к логам: аннотации Checks API, сводка прогона и
      # артефакт. Раньше отчет писался инлайном здесь же, и при падении шага он
      # не появлялся нигде: три прогона подряд закончились «exit code 1» без
      # единого слова о причине. Теперь реализация в scripts/, ее же зовет
      # tests/test_openapi_contract.py, а вывод шага дублируется в сводку
      # безусловно (set +e) — причину видно и тогда, когда скрипт упал.
      - name: OpenAPI не разошёлся с кодом
        env:
          # Отчёт печатается по-русски: без явной кодировки локаль раннера может
          # оказаться иной, и печать упала бы, унеся с собой диагностику.
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          python scripts/check_openapi_contract.py 2>&1 | tee /tmp/openapi.log
          code=${PIPESTATUS[0]}
          {
            echo '## Сверка OpenAPI'
            echo '```'
            cat /tmp/openapi.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Страховка на случай, когда скрипт не дошел до печати аннотаций.
          if [ "$code" != "0" ]; then
            echo "::error title=Контракт OpenAPI::сверка не пройдена, код $code; отчёт в сводке прогона и в артефакте pytest-report"
          fi
          exit "$code"

      - name: Артефакты pytest при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: |
            backend/.pytest_cache
            .test_data
          retention-days: 7