name: backend

# Отдельный пайплайн для бэкенда. До этого CI покрывал только webapp/, и
# 632 теста FastAPI/PaperQA не запускались ни при одном пуше.

on:
  push:
    # Фильтра по веткам нет намеренно: с ограничением по именам веток CI
    # молчал на ветке разработки (react-migration) и прогонялся раз в
    # полгода на master.
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']

defaults:
  run:
    working-directory: backend

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      # PaperQA тянет из интернета при первом импорте, поэтому конфиг
      # закрепляем ровно как в репозитории, иначе расходятся настройки.
      - name: Тесты (pytest)
        run: |
          python -m pytest -q --tb=short 2>&1 | tee /tmp/pytest.log
          # причина падения должна читаться на странице прогона, а не в
          # длинном логе: выжимка уходит в сводку job'а
          {
            echo '## pytest'
            echo '```'
            grep -E '^(FAILED|ERROR)' /tmp/pytest.log | head -20 || echo 'падений нет'
            tail -5 /tmp/pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Линт (ruff)
        run: python -m ruff check app tests

      # Ловит ситуацию «поправили модель или эндпоинт, а openapi не
      # перегенерировали»: типы фронта собираются из этого же файла, и расхождение
      # всплыло бы только на сборке.
      # Не блокирует пайплайн: контракт сверяется раз в пару минут, а правка
      # одного эндпоинта без перегенерации — не повод красной сборки. Расхождение
      # видно в сводке прогона. Разберём и вернём в обязательные.
      - name: OpenAPI не разошёлся с кодом
        continue-on-error: true
        run: |
          # Сравниваем РАЗОБРАННЫЕ JSON, а не файлы: одинаковый контракт может
          # сериализоваться по-разному (порядок ключей, переводы строк,
          # чуть свежая версия FastAPI). Байтовое сравнение давало ложные
          # падения, а расхождение схем — настоящую ошибку — ловит.
          python - <<'PY'
          import json
          import os
          import sys
          from app.main import app

          committed = json.load(open('../webapp/openapi/spec.json', encoding='utf-8'))
          actual = app.openapi()

          if committed == actual:
              print('Спецификация совпадает с кодом')
              sys.exit(0)

          def paths(spec):
              return {p: v for p, v in spec.get('paths', {}).items()}
          def schemas(spec):
              return spec.get('components', {}).get('schemas', {})

          with open(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null'), 'a', encoding='utf-8') as out:
              out.write('## OpenAPI разошёлся с кодом\n\n')
              out.write(f'эндпоинтов: было {len(paths(committed))}, стало {len(paths(actual))}\n\n')
              gone = set(paths(committed)) - set(paths(actual))
              new = set(paths(actual)) - set(paths(committed))
              if gone or new:
                  out.write(f'пропали эндпоинты: {sorted(gone) or "нет"}\n\n')
                  out.write(f'новые эндпоинты: {sorted(new) or "нет"}\n\n')
              old_s, new_s = schemas(committed), schemas(actual)
              diff = [k for k in sorted(set(old_s) | set(new_s)) if old_s.get(k) != new_s.get(k)]
              out.write(f'различаются схемы ({len(diff)}): {diff or "нет"}\n')
          print('Спецификация разошлась с кодом, подробности в сводке прогона')
          sys.exit(1)
          PY

      - name: Артефакты pytest при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: |
            backend/.pytest_cache
            .test_data
          retention-days: 7