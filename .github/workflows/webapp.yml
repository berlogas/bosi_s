name: webapp

on:
  push:
    # Фильтра по веткам нет намеренно, как в backend.yml: с ограничением по
    # именам веток фронтовые проверки молча не запускались на ветке
    # разработки react-migration (в списке было master и webapp/**), то есть
    # tsc, eslint, prettier, vitest и Playwright на этой ветке не проходили
    # ни разу, а «красный CI» показывал только backend.
    paths: ['webapp/**', '.github/workflows/webapp.yml']
  pull_request:
    paths: ['webapp/**', '.github/workflows/webapp.yml']

defaults:
  run:
    working-directory: webapp

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Типы API не устарели
        run: npm run codegen:check

      - name: Линт (ESLint)
        run: npm run lint

      - name: Формат (Prettier)
        run: npm run format:check

      - name: Типы (tsc strict)
        run: npm run typecheck

      - name: Тесты (Vitest)
        run: npm test

      - name: E2E (Playwright)
        run: |
          npx playwright install --with-deps chromium
          # multiuser.spec.ts в CI исключён конфигом (testIgnore): он бьёт по
          # живому стенду и требует поднятого backend и пользователей
          # mu_ivan/mu_petr/mu_admin. На машине со стендом гоняется целиком:
          # npm run test:e2e.
          npm run test:e2e

      - name: Сборка
        run: npm run build

      - name: Артефакты Playwright при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            webapp/playwright-report
            webapp/test-results
          retention-days: 7
