# boasi_s — локальный стек. Продакшн-переопределение: docker-compose.prod.yml
#
# Модели Ollama тянутся заранее: `make pull-models`. Без них платформа
# стартует, но не сможет отвечать (см. docs/OPERATIONS.md).
services:
  ollama:
    image: ollama/ollama:latest
    container_name: boasi-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: boasi-backend
    restart: unless-stopped
    # Владелец каталого данных: файлы в data/ будут приналежаться владельцу каталога. На Linux файлы
    # станут root:root, и хостовый пользователь снова сне удалить без sudo.
    #
    # Решение: пользователь UID/GID хоста через переменные переменные:
    #   DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) docker compose up -d
    user: "${DOCKER_UID:-0}:${DOCKER_GID:-0}"
    depends_on:
      ollama:
        condition: service_healthy
    env_file: [.env]
    environment:
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/boasi.sqlite3
      PQA_HOME: /data/pqa
      # Бэкапы — в ОТДЕЛЬНЫЙ каталог. Кладя их внутрь /data, мы получили бы
      # бэкап внутри бэкапа: архив рос бы с каждой копией.
      BACKUP_DIR: /backups
      BACKUP_KEEP: "14"
      # Папка-приёмник: файлы кладёте сюда на хосте (./data/inbox), backend по кнопке
      # в админке индексирует их и переносит в /data/documents/library.
      INBOX_DIR: /data/inbox
      LIBRARY_DIR: /data/documents/library
      REJECTED_DIR: /data/rejected
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Каталог данных — bind-mount на ./data хоста: одна и та же БД и файлы
      # видят и контейнеру, и локальному запуску backend (scripts/start.sh).
      # Пути файлов в БД хранятся относительно от DATA_DIR, поэтому переезд
      # между хостом и контейнером ничего не ломает.
      - ./data:/data
      - ./backups:/backups
    # Явный healthcheck (в Dockerfile тоже есть, но здесь видно и можно задать
    # запас: первый старт грузит модель эмбеддингов и восстанавливает индекс —
    # это минуты, а не секунды).
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    # Ограничения dev-машины (8 CPU, без GPU). В проде — docker-compose.prod.yml
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: boasi-webapp
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Внутри Docker сети backend доступен по имени сервиса, а не localhost.
      VITE_API_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
volumes:
  ollama_models:
    name: boasi_ollama_models