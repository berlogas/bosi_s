# boasi_s — локальный стек. Продакшн-переопределение: docker-compose.prod.yml
#
# Модели Ollama тянутся заранее: `make pull-models`. Без них платформа
# стартует, но не сможет отвечать (см. docs/OPERATIONS.md).
services:
  ollama:
    image: ollama/ollama:latest
    container_name: boasi-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: boasi-backend
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    env_file: [.env]
    environment:
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/boasi.sqlite3
      PQA_HOME: /data/pqa
      # Бэкапы — в ОТДЕЛЬНЫЙ том. Кладя их внутрь /data, мы получили бы
      # бэкап внутри бэкапа: архив рос бы с каждой копией.
      BACKUP_DIR: /backups
      BACKUP_KEEP: "14"
      # Папка-приёмник: файлы кладёте сюда на хосте, backend по кнопке
      # в админке индексирует их и переносит в /data/documents/library.
      INBOX_DIR: /data/inbox
      LIBRARY_DIR: /data/documents/library
      REJECTED_DIR: /data/rejected
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - boasi_data:/data
      - boasi_backups:/backups
      # Приёмник файлов для массового добавления. Каталог inbox/ в корне
      # репозитория создаётся один раз: mkdir -p inbox
      - ./inbox:/data/inbox
    # Явный healthcheck (в Dockerfile тоже есть, но здесь видно и можно задать
    # запас: первый старт грузит модель эмбеддингов и восстанавливает индекс —
    # это минуты, а не секунды).
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    # Ограничения dev-машины (8 CPU, без GPU). В проде — docker-compose.prod.yml
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G

volumes:
  ollama_models:
    name: boasi_ollama_models
  boasi_data:
    name: boasi_data
  # Копии данных. Отдельный том: снимать их из /data нельзя, иначе архив
  # будет содержать предыдущие архивы. Ротацию делает backend (BACKUP_KEEP).
  boasi_backups:
    name: boasi_backups
