# Настройки Streamlit для boasi_s.
#
# toolbarMode = "minimal" убирает из шапки кнопку «Deploy»: она открывает
# диалог развёртывания приложения в интернете (Streamlit Community Cloud
# или своё облако), а для локальной научной системы это лишнее и рискованно
# — публикация унесла бы наружу переписку и учётные записи.
[client]
toolbarMode = "minimal"